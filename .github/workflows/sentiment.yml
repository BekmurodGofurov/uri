name: sentiment-svc CI

on:
  pull_request:
    paths:
      - "sentiment-svc/**"

defaults:
  run:
    working-directory: sentiment-svc

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=60