name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff (linter)
        run: |
          ruff check .

      - name: Run Ruff (format check)
        run: |
          ruff format --check .

      - name: Run Pytest with coverage
        run: |
          pytest --cov-fail-under=60 --cov-report=xml:coverage.xml --cov-report=html:coverage_html

      - name: Print coverage summary
        if: always()
        run: |
          python -m coverage report --skip-covered || true

      - name: Upload coverage XML (for badge/external tools)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 30
