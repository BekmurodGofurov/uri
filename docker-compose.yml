services:
  postgres:
    image: postgres:16-alpine
    container_name: uri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env file}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env file}
      PGPORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set in .env file}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set in .env file}:${POSTGRES_PORT:?POSTGRES_PORT must be set in .env file}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentiment-svc:
    build:
      context: .
      dockerfile: sentiment-svc/Dockerfile
    image: ${SENTIMENT_IMAGE:-sentiment-svc:v1}
    container_name: uri-sentiment-svc
    restart: unless-stopped
    ports:
      - "${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}:${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}"
    environment:
      PORT: ${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}
      SENTIMENT_PORT: ${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}
      MODEL_PATH: ${MODEL_PATH:-models/tfidf_v1.joblib}
      MODEL_TYPE: ${MODEL_TYPE:-tfidf}
      MODEL_VERSION: ${MODEL_VERSION:-sentiment-v1}
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}"]
    volumes:
      - ./sentiment-svc/models:/workspace/sentiment-svc/models
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  aspect-svc:
    build:
      context: .
      dockerfile: aspect-svc/Dockerfile
    image: uri-aspect-svc:v1
    container_name: uri-aspect-svc
    restart: unless-stopped
    ports:
      - "${ASPECT_PORT:?ASPECT_PORT must be set in .env file}:${ASPECT_PORT:?ASPECT_PORT must be set in .env file}"
    environment:
      PORT: ${ASPECT_PORT:?ASPECT_PORT must be set in .env file}
      ASPECT_PORT: ${ASPECT_PORT:?ASPECT_PORT must be set in .env file}
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${ASPECT_PORT:?ASPECT_PORT must be set in .env file}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${ASPECT_PORT:?ASPECT_PORT must be set in .env file}/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: uri-gateway:latest
    container_name: uri-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}:${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}"
    environment:
      PORT: ${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}
      GATEWAY_PORT: ${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set in .env file}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env file}@postgres:${POSTGRES_PORT:?POSTGRES_PORT must be set in .env file}/${POSTGRES_DB:?POSTGRES_DB must be set in .env file}
      SENTIMENT_SVC_URL: http://sentiment-svc:${SENTIMENT_PORT:?SENTIMENT_PORT must be set in .env file}
      ASPECT_SVC_URL: http://aspect-svc:${ASPECT_PORT:?ASPECT_PORT must be set in .env file}
      API_KEY: ${API_KEY:?API_KEY must be set in .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env file}
    command: ["sh", "-c", "uvicorn gateway.api.app:app --host 0.0.0.0 --port ${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}"]
    depends_on:
      postgres:
        condition: service_healthy
      sentiment-svc:
        condition: service_started
      aspect-svc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${GATEWAY_PORT:?GATEWAY_PORT must be set in .env file}/api/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: uri-dashboard
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT must be set in .env file}:${FRONTEND_PORT:?FRONTEND_PORT must be set in .env file}"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT must be set in .env file}
      VITE_PORT: ${FRONTEND_PORT:?FRONTEND_PORT must be set in .env file}
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set in .env file}
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data:




