[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "*.md",
    "sentiment-svc",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S311"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
pythonpath = ["."]
addopts = "-v --cov=shared --cov=gateway --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:coverage_html"
